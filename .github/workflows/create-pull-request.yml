name: Create Pull Request
on: create
jobs:
  create-pull-request:
    if: github.ref_type == 'branch' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          # Get current branch name
          branch_name=$(git symbolic-ref --short HEAD)
          # Create pull request using GitHub CLI, update it when one already exists
          gh_pr_up() { gh pr create "$@" || gh pr edit "$@"; }
          gh_pr_up --base develop \
            --title "Auto-generated Pull Request for $branch_name" \
            --body "Pulling '$branch_name' into develop. Please review and merge."
