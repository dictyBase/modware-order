version: "2"
run:
  allow-parallel-runners: true
linters-settings:
   funlen:
    lines: 80
    statements: 50
    ignore-comments: true
   lll:
      line-length: 130
   revive:
      rules:
        - name: var-naming
          arguments: [["ID"]]
   gosec:
      excludes:
        - G404
   wrapcheck:
      ignoresigs:
        - .HandleGetError(
        - .HandleGenericError(
        - .HandleInsertError(
        - .HandleNotFoundError(
        - .HandleInvalidError(
        - .HandleInvalidParamError(
        - .HandleUpdateError(
        - .Errorf(
        - errors.New(
linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - bidichk
    - cyclop
    - decorder
    - dogsled
    - dupl
    - errcheck
    - errname
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - gocognit
    - gomoddirectives
    - gomodguard
    - grouper
    - ineffassign
    - importas
    - lll
    - maintidx
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nolintlint
    - prealloc
    - paralleltest
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - thelper
    - tparallel
    - testifylint
    - unparam
    - unused
    - unconvert
    - unparam
    - varnamelen
    - wastedassign
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports
    - gci
